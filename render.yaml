services:
  - type: web
    name: hairhub-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: hairhub-api
          property: url
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: hairhub-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://hairhub-hv62.onrender.com
      - key: FRONTEND_URLS
        value: https://hairhub-hv62.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: hairhub-hv62.onrender.com
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: hairhub-db
    databaseName: hairhub
    user: hairhub
    region: oregon
    plan: free
    ipAllowList: []
